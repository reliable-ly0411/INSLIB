# Ideal data - filter error should be zero

name: A_ideal
aiding: gnss # use GNSS
init: ref    # known truth start from ref.csv
automotive_mode: 0
chi2_disable: 1             # 1: disable outlier downweighting (diagnostics)
chi2_reject_alpha: 0      # 0 -> outlier gate; e.g. 0.05 -> 95% global
allow_unlimited_deadreckoning: 1  # 1: never expire the IMU-only coasting window
max_deadreckoning_sec: 60.0  # IMU-only coasting budget [s]; 0 -> default 10 s
gyro_bias_window_sec: 0.0   # no parked phase in this trial (already flying at t=0)

imu:
  # Noise-free IMU: slow phases of the trajectory have zero sample variance
  # and look like a standstill, so the auto-ZUPT/ZARU would pin the velocity
  # and absorb the turn rate into the gyro bias.
  auto_zupt_disable: 1
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
  gyr_psd: 1.0e-07    # rad^2/s, gyro_noise_PSD
  acc_psd: 1.0e-07    # (m/s^2)^2/Hz, accel_noise_PSD
  gyr_bias_rw: 1.0e-08    # rad/s/sqrt(s), sqrt(gyro_bias_PSD)
  acc_bias_rw: 0.0001    # m/s^2/sqrt(s), sqrt(accel_bias_PSD)

gnss:
  leverarm_frd: [0.0, 0.0, 0.0]    # in IMU FRD body system to GNSS antenna
  delay_ms: 0               # assumed fixed fix latency          [ms]

score:
  ahrs: 1
  warmup_sec: 5
  min_epochs: 100
  # Regression guard-rails just above the known-good run. This scenario is
  # noise-free, so a trip means a real filter fault (the auto-ZUPT/ZARU
  # pinning a slow phase once cost ~19 deg of yaw and 4 m of position), not
  # sensor noise. After an intentional change inspect, then retune. They are
  # NOT accuracy claims.
  lim_att_bias_deg: 0.016           # observed 0.012 (pitch)
  lim_att_std_deg: 0.06             # observed 0.056 (pitch)
  lim_yaw_bias_deg: 0.159           # observed 0.151
  lim_yaw_std_deg: 0.207            # observed 0.197
  lim_pos_rms_m: 0.038              # observed 0.034
  lim_baro_rms_m: 0.666             # observed 0.634
  lim_baro_bias_m: 0.522            # observed 0.496
  lim_baro_max_m: 1.52              # observed 1.447
  lim_ellipsoid_rms_m: 0.014        # observed 0.011
  lim_ellipsoid_bias_m: 0.011       # observed 0.007
  lim_ellipsoid_max_m: 0.035        # observed 0.031
  lim_ars_att_bias_deg: 0.613       # observed 0.584 (pitch)
  lim_ars_roll_std_deg: 0.257       # observed 0.244
  lim_ars_pitch_std_deg: 0.534      # observed 0.509
  lim_ars_yaw_drift_deg_min: 0.045  # observed 0.041

mag:
  enable: 1
  stddev_ut: 0            # heading-measurement noise [uT] (0 -> default)
  wmm_year: 2026.0          # decimal year for the declination lookup
  estimate_bias: 0          # 18-state hard-iron bias
  fixed_bias: [0,0,0]       # hard-iron [uT] misalignment: soft-iron 3x3
  misalignment: [1,0,0, 0,1,0, 0,0,1]

baro:
  enable: 1
  stddev_m: 0             # 0 -> baro_alt default
  acc_bias_rw: 0          # accel-bias drift  [m/s^2/sqrt(Hz)], 0 -> default
  acc_bias_init_mps2: 0   # INITIAL accel-bias stddev [m/s^2], 0 -> default
  acc_noise_mps2_sqrthz: 0 # accel-noise density [m/s^2/sqrt(Hz)]
  h_process_noise: 0      # direct height process noise [m/sqrt(Hz)], 0 -> default

ahrs:
  gyr_noise_psd: 0        # [rad/s/sqrt(Hz)], 0 -> default
  gyr_bias_rw: 1.0e-09    # [rad/s^2/sqrt(Hz)], stiff: truth gyro bias is 0 for this scenario
  acc_noise_mps2: 0       # [m/s^2], 0 -> default
  gyr_bias_init_stddev_rps_deg: 0.01  # start bias 0, high confidence: truth is bias-free

inputs:                     # optional per-stream CSV filename overrides
  imu:  IMU.csv             # each unset key -> the conventional <stream>.csv
  ref:  ref.csv
  gnss: GNSS.csv
  mag:  Mag.csv
  baro: Baro.csv
