# Source: KF-GINS Leador-A15/RTK-GNSS car trial with the SYNTHETIC GNSS
# velocity of gnss_vel.csv and SYNTHETIC GNSS faults (REQ-VER-050): L1 single
# point fixes with the spike faults on top (3 single fixes 5 to 50 m off,
# accuracy kept), one event every 90 s. gnss_spp_spike.csv is written by
# tools/gnss_faults.py from gnss_vel.csv and ref.csv with fixed seeds. INSLIB
# runs with its own outlier handling (chi2 on), so this replay guards that
# handling against regressions. Everything else as config_vel.yaml.
name: kfgins-leador-a15-spp-spike
aiding: gnss    # gnss_spp_spike.csv, see the header
init: ref
automotive_mode: 0
chi2_disable: 0             # chi2 gate on: outliers downweighted
# Covariance prediction at the IMU rate, to match KF-GINS (REQ-VER-049).
kalman_update_dt_sec: 0.005
gyro_bias_window_sec: 10    # vehicle idle from starttime to ~+60s, see truth.nav

init_stddev:                # kf-gins.yaml initposstd/initvelstd (max
  pos_init_stddev_m: 0.008  # component) and initattstd roll,pitch / yaw
  vel_init_stddev_mps: 0.004
  rpy_init_stddev_rad_deg: 0.003
  yaw_init_stddev_rad_deg: 0.023

imu:
   gyr_psd: 7.61543549e-13    # (rad/s)^2/Hz, from kf-gins.yaml imunoise.arw (ARW^2, deg/sqrt(hr) -> rad/sqrt(s))
   acc_psd: 2.5e-07    # (m/s^2)^2/Hz, imunoise.vrw (VRW^2)
   gyr_bias_rw: 1.54266769e-09    # rad/s/sqrt(s), imunoise.gbstd + corrtime (GM sigma^2=q*T/2)
   acc_bias_rw: 1.76776695e-06    # m/s^2/sqrt(s), imunoise.abstd + corrtime
   rpy_pred_stddev_rad_sqrts: 1.0e-05
   auto_zupt_static_gyr_stddev_deg: 0.10
   auto_zupt_static_acc_stddev_mps2: 0.15
   auto_zupt_dwell_sec: 3.0


gnss:
  leverarm_frd: [0.136, -0.301, -0.184]    # kf-gins.yaml lever arm (GNSS antenna vs IMU)
  pos_stddev_fallback_m: [1, 2]
  # RTK fixes: gnss.csv reports ~1 cm horizontal / 2 cm vertical (REQ-NAV-092)
  pos_stddev_floor_hor_m: 0.005
  pos_stddev_floor_ver_m: 0.005
  # The synthetic velocity is white noise of exactly its reported 1-sigma,
  # so it is fused as reported: no floor, no manoeuvre dependent inflation
  # (EKF3 gets the same sigma in the comparison).
  vel_stddev_floor_hor_mps: -1
  vel_stddev_floor_ver_mps: -1
  vel_noise_acc_scale_hor: -1
  vel_noise_acc_scale_ver: -1

score:
  leverarm_frd: [0, 0, 0.0001]    # truth.nav/navresult.nav refer to the IMU center, same as the filter state
  ahrs: 0    # the IMU-only ARS is not part of this comparison
  # Scored from 60 s after the car first moves, as config_vel.yaml. Counted
  # from the first fix in gnss.csv, which is 50 s older than the first IMU
  # sample.
  warmup_sec: 171.8
  min_epochs: 3000
  # Regression guard-rails vs. ground truth: observed + max(5 %, 0.003),
  # rounded up. A trip means inspect, then retune to known-good.
  lim_att_bias_deg:                 0.004    # observed 0.001
  lim_att_std_deg:                  0.009    # observed 0.006
  lim_yaw_bias_deg:                 0.098    # observed 0.093
  lim_yaw_std_deg:                  0.113    # observed 0.107
  lim_pos_rms_m:                    3.135    # observed 2.985

inputs:
  gnss: gnss_spp_spike.csv
  ref: ref.csv
