# Source: KF-GINS Leador-A15/RTK-GNSS car trial
# config.yaml: scores against truth.nav (ref.csv) - independent ground truth
# The start state is the truth's (init: ref).
name: kfgins-leador-a15
aiding: gnss    # real RTK epochs from gnss.csv, position-only
init: ref
automotive_mode: 1 # unused without velocity
automotive_min_yaw_stddev_deg: 5
chi2_disable: 1             # 1: disable outlier downweighting (diagnostics)
# Covariance prediction at the IMU rate (REQ-VER-049).
kalman_update_dt_sec: 0.005
gyro_bias_window_sec: 10    # vehicle idle from starttime to ~+60s, see truth.nav

init_stddev:                # kf-gins.yaml initposstd/initvelstd (max
  pos_init_stddev_m: 0.008  # component) and initattstd roll,pitch / yaw
  vel_init_stddev_mps: 0.004
  rpy_init_stddev_rad_deg: 0.003
  yaw_init_stddev_rad_deg: 0.023

imu:
   gyr_psd: 7.61543549e-13    # (rad/s)^2/Hz, from kf-gins.yaml imunoise.arw (ARW^2, deg/sqrt(hr) -> rad/sqrt(s))
   acc_psd: 2.5e-07    # (m/s^2)^2/Hz, imunoise.vrw (VRW^2)
   gyr_bias_rw: 1.54266769e-09    # rad/s/sqrt(s), imunoise.gbstd + corrtime (GM sigma^2=q*T/2)
   acc_bias_rw: 1.76776695e-06    # m/s^2/sqrt(s), imunoise.abstd + corrtime
   rpy_pred_stddev_rad_sqrts: 1.0e-05
   auto_zupt_static_gyr_stddev_deg: 0.10
   auto_zupt_static_acc_stddev_mps2: 0.15
   auto_zupt_dwell_sec: 3.0


gnss:
  leverarm_frd: [0.136, -0.301, -0.184]    # kf-gins.yaml antlever (GNSS antenna vs IMU)
  pos_stddev_fallback_m: [1, 2]
  # RTK fixes: gnss.csv reports ~1 cm horizontal / 2 cm vertical, and the
  # standstill spread of the fixes is smaller still. The floor sits below
  # the reported sigmas so they are fused as reported, as KF-GINS fuses
  # them (a floor of 0.05/0.15 m cost 3 mm horizontal RMS once the fixes
  # were fused at their time of validity, REQ-NAV-092).
  pos_stddev_floor_hor_m: 0.005
  pos_stddev_floor_ver_m: 0.005

score:
  leverarm_frd: [0, 0, 0.0001]    # truth.nav/navresult.nav refer to the IMU center, same as the filter state
  ahrs: 0    # the IMU-only ARS is not part of this comparison
  # Scored from 60 s after the car first moves, the window of the readme.md
  # comparison table, so this replay prints that table's INSLIB row. Counted
  # from the first fix in gnss.csv, which is 50 s older than the first IMU
  # sample.
  warmup_sec: 171.8
  min_epochs: 3000
  # Regression guard-rails vs. ground truth: observed + max(5 %, 0.003),
  # rounded up. A trip means inspect, then retune to known-good.
  # Attitude limits remeasured once the reference attitude was interpolated
  # to the estimate's epoch (REQ-VER-047): the scatter no longer carries
  # rotation rate times the age of the reference row, the bias shifts by
  # its mean over the run.
  lim_att_bias_deg: 0.004           # observed 0.0004 (pitch)
  lim_att_std_deg: 0.005            # observed 0.0013 (pitch)
  lim_yaw_bias_deg: 0.004           # observed 0.0002
  lim_yaw_std_deg: 0.020            # observed 0.0165
  lim_pos_rms_m: 0.016              # observed 0.0128

inputs:
  ref: ref.csv
