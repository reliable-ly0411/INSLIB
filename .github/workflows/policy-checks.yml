name: Release policy safety checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/release_policy -p 'test_*.py' -v
      - run: python3 -m py_compile .github/release_policy/*.py
